<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif">
  <rect width="1240" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="620" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#232f3e">Target architecture: Perl to Python modernization with AWS Transform custom</text>

  <!-- ===================== Source stack ===================== -->
  <rect x="30" y="80" width="250" height="170" rx="8" fill="#f2f6fc" stroke="#4a76bd" stroke-width="2"/>
  <text x="155" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Source technology stack</text>
  <line x1="50" y1="118" x2="260" y2="118" stroke="#c4d4ea"/>
  <text x="50" y="142" font-size="12.5" fill="#232f3e">Language: Perl 5</text>
  <text x="50" y="166" font-size="12.5" fill="#232f3e">Modules: Getopt::Long,</text>
  <text x="50" y="183" font-size="12.5" fill="#232f3e">Data::Dumper</text>
  <text x="50" y="207" font-size="12.5" fill="#232f3e">I/O: local flat-file logs</text>
  <text x="50" y="231" font-size="12.5" fill="#232f3e">Platform: on-premises</text>

  <!-- ===================== Target stack ===================== -->
  <rect x="960" y="80" width="250" height="170" rx="8" fill="#eef7ef" stroke="#3a9b4e" stroke-width="2"/>
  <text x="1085" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d652d">Target technology stack</text>
  <line x1="980" y1="118" x2="1190" y2="118" stroke="#c4e6cb"/>
  <text x="980" y="142" font-size="12.5" fill="#232f3e">Language: Python 3.12</text>
  <text x="980" y="166" font-size="12.5" fill="#232f3e">Libraries: argparse, re,</text>
  <text x="980" y="183" font-size="12.5" fill="#232f3e">json, dataclasses (stdlib)</text>
  <text x="980" y="207" font-size="12.5" fill="#232f3e">Tests: pytest equivalence</text>
  <text x="980" y="231" font-size="12.5" fill="#232f3e">suite vs. baselines</text>

  <!-- ===================== Step 1: inputs ===================== -->
  <rect x="30" y="300" width="1180" height="118" rx="8" fill="#f7f8fa" stroke="#879196" stroke-width="1.5"/>
  <text x="48" y="326" font-size="14" font-weight="bold" fill="#232f3e">Step 1 &#8212; Prepare inputs (standardized four-folder structure + reference)</text>
  <!-- folder chips -->
  <rect x="55" y="342" width="215" height="58" rx="6" fill="#ffffff" stroke="#aab2b7"/>
  <text x="162" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232f3e">source-code/</text>
  <text x="162" y="385" text-anchor="middle" font-size="11.5" fill="#687078">legacy Perl program</text>
  <rect x="285" y="342" width="215" height="58" rx="6" fill="#ffffff" stroke="#aab2b7"/>
  <text x="392" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232f3e">input-data/</text>
  <text x="392" y="385" text-anchor="middle" font-size="11.5" fill="#687078">input fixtures</text>
  <rect x="515" y="342" width="215" height="58" rx="6" fill="#ffffff" stroke="#aab2b7"/>
  <text x="622" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232f3e">output-data/</text>
  <text x="622" y="385" text-anchor="middle" font-size="11.5" fill="#687078">Perl baselines</text>
  <rect x="745" y="342" width="215" height="58" rx="6" fill="#ffffff" stroke="#aab2b7"/>
  <text x="852" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232f3e">reference/</text>
  <text x="852" y="385" text-anchor="middle" font-size="11.5" fill="#687078">perlstyle + mapping guide</text>
  <rect x="975" y="342" width="215" height="58" rx="6" fill="#ffffff" stroke="#aab2b7"/>
  <text x="1082" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232f3e">documents/</text>
  <text x="1082" y="385" text-anchor="middle" font-size="11.5" fill="#687078">TD specification</text>

  <!-- ===================== AWS Transform custom container ===================== -->
  <rect x="30" y="460" width="1180" height="300" rx="10" fill="#fef9ec" stroke="#f0a000" stroke-width="2"/>
  <text x="48" y="487" font-size="14" font-weight="bold" fill="#8a5a00">AWS Transform custom (agentic AI)</text>

  <!-- Step 2 box -->
  <rect x="60" y="505" width="520" height="230" rx="8" fill="#ffffff" stroke="#f0a000" stroke-width="1.5"/>
  <text x="320" y="530" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#232f3e">Step 2 &#8212; Business rule extraction (BRE)</text>
  <rect x="82" y="544" width="476" height="46" rx="6" fill="#fff6da" stroke="#f0a000"/>
  <text x="320" y="563" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">AWS/business-rules-extraction</text>
  <text x="320" y="580" text-anchor="middle" font-size="11" fill="#687078">static analysis, no build, no source modification</text>
  <rect x="82" y="598" width="476" height="46" rx="6" fill="#fff6da" stroke="#f0a000"/>
  <text x="320" y="617" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">BRE document: business rules + edge cases</text>
  <text x="320" y="634" text-anchor="middle" font-size="11" fill="#687078">validations, workflows, diagrams</text>
  <rect x="82" y="652" width="476" height="46" rx="6" fill="#fdeaea" stroke="#d13212"/>
  <text x="320" y="671" text-anchor="middle" font-size="12" font-weight="bold" fill="#b0280a">Human review gate</text>
  <text x="320" y="688" text-anchor="middle" font-size="11" fill="#687078">review, correct, approve before generation</text>

  <!-- Step 3 box -->
  <rect x="660" y="505" width="520" height="230" rx="8" fill="#ffffff" stroke="#f0a000" stroke-width="1.5"/>
  <text x="920" y="530" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#232f3e">Step 3 &#8212; Generate and validate</text>
  <rect x="682" y="544" width="476" height="40" rx="6" fill="#fff6da" stroke="#f0a000"/>
  <text x="920" y="569" text-anchor="middle" font-size="12" font-weight="bold" fill="#232f3e">Perl5-to-Python312-Modernization (custom TD)</text>
  <rect x="682" y="592" width="228" height="42" rx="6" fill="#fff6da" stroke="#f0a000"/>
  <text x="796" y="617" text-anchor="middle" font-size="11.5" fill="#232f3e">Generate Python 3.12 app</text>
  <rect x="930" y="592" width="228" height="42" rx="6" fill="#fff6da" stroke="#f0a000"/>
  <text x="1044" y="617" text-anchor="middle" font-size="11.5" fill="#232f3e">Run pytest vs. baselines</text>
  <polygon points="796,645 884,673 796,701 708,673" fill="#fdeaea" stroke="#d13212"/>
  <text x="796" y="670" text-anchor="middle" font-size="11" font-weight="bold" fill="#b0280a">Equivalent?</text>
  <rect x="930" y="651" width="228" height="44" rx="6" fill="#fff6da" stroke="#f0a000"/>
  <text x="1044" y="670" text-anchor="middle" font-size="11.5" fill="#232f3e">Self-debug + iterate</text>
  <text x="1044" y="686" text-anchor="middle" font-size="10.5" fill="#687078">fix app, never baselines</text>
  <!-- loop arrows within step 3 -->
  <path d="M930 673 L888 673" stroke="#d13212" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M1044 651 L1044 636" stroke="#d13212" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- markers -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a6672"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a9b4e"/></marker>
  </defs>

  <!-- flow arrows -->
  <path d="M155 250 L155 300" stroke="#5a6672" stroke-width="2" marker-end="url(#ar)"/>
  <text x="168" y="278" font-size="10.5" fill="#687078">prepare</text>
  <path d="M620 418 L620 460" stroke="#5a6672" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M580 620 L660 620" stroke="#5a6672" stroke-width="2" marker-end="url(#ar)"/>
  <text x="590" y="612" font-size="10.5" fill="#687078">approved BRE</text>
  <!-- success path to target -->
  <path d="M884 673 Q1085 673 1085 250" stroke="#3a9b4e" stroke-width="2" fill="none" marker-end="url(#arg)"/>
  <text x="1095" y="470" font-size="11" font-weight="bold" fill="#0d652d">Yes</text>

  <!-- caption -->
  <text x="620" y="788" text-anchor="middle" font-size="11.5" fill="#687078">Equivalence is proven by test: byte-exact for deterministic output, documented semantic comparison for non-deterministic output (e.g. Data::Dumper).</text>
</svg>
